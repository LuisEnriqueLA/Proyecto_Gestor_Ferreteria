<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Salidas</title>

    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <header>
        <h1>Registro de Salidas</h1>
    </header>

    <main>

        <section>

            <h2>Registrar salida</h2>

            <form id="formularioSalida">

                <label for="producto">
                    Producto
                </label>

                <select id="producto" required>

                    <option value="">
                        Selecciona un producto
                    </option>

                </select>


                <label for="cantidad">
                    Cantidad
                </label>

                <input
                    type="number"
                    id="cantidad"
                    min="1"
                    required
                >


                <button type="submit">
                    Registrar salida
                </button>

            </form>

        </section>


        <section>

            <h2>Historial de salidas</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Fecha</th>
                    </tr>

                </thead>

                <tbody id="tablaSalidas"></tbody>

            </table>

        </section>

    </main>


    <script src="./js/model/salidas.js"></script>
    <script src="./js/view/salidaVista.js"></script>
    <script src="./js/controller/salidasController.js"></script>

</body>
</html>
