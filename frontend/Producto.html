<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Control de Productos</title>
</head>

<body>

    <header>
        <h1>Control de Productos</h1>
    </header>

    <main>

        <section>

            <h2 id="tituloFormulario">Agregar producto</h2>

            <form id="formularioProducto">

                <input type="hidden" id="id">

                <div>
                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        class="form-control"
                        required
                    >
                </div>

                <div>
                    <label for="detalles" class="form-label">
                        Detalles
                    </label>

                    <input
                        type="text"
                        id="detalles"
                        class="form-control"
                    >
                </div>

                <div>
                    <label for="precio" class="form-label">
                        Precio
                    </label>

                    <input
                        type="number"
                        id="precio"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div>
                    <label for="existencia" class="form-label">
                        Existencia
                    </label>

                    <input
                        type="number"
                        id="existencia"
                        class="form-control"
                        min="0"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar producto
                </button>

                <button
                    type="button"
                    id="btnCancelar"
                    class="btn btn-secondary"
                    style="display: none;"
                >
                    Cancelar
                </button>

            </form>

        </section>

        <section>

            <h2>Productos</h2>

            <div>

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Detalles</th>
                            <th>Precio</th>
                            <th>Existencia</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="tablaProducto">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="./js/model/productos.js"></script>
    <script src="./js/view/productosVista.js"></script>
    <script src="./js/controller/productosController.js"></script>

</body>

</html>
